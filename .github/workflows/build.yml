# Baut PDF-OCR auf einem Windows-Server von GitHub (kostenlos für öffentliche Repos).
# - bei jedem Push / Pull Request: Build + Artefakte zum Herunterladen
# - bei einem Tag "v1.2.3": zusätzlich GitHub-Release mit Setup und portabler exe
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inno Setup sicherstellen
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Python-Umgebung anlegen
        shell: pwsh
        run: python -m venv .venv

      - name: Bauen
        shell: pwsh
        run: ./build.ps1

      - name: Rauchtest (Tesseract installieren, Beispiel-PDF verarbeiten)
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          .venv\Scripts\python.exe -c "from PIL import Image,ImageDraw,ImageFont; import img2pdf; im=Image.new('L',(1700,900),255); ImageDraw.Draw(im).text((100,300),'Rechnung Nummer 4711 Testtext',font=ImageFont.load_default(60),fill=0); im.save('t.png',dpi=(200,200)); open('smoke.pdf','wb').write(img2pdf.convert('t.png'))"
          New-Item -ItemType Directory smoke | Out-Null
          Move-Item smoke.pdf smoke\
          dist\pdf-ocr\pdf-ocr.exe --no-pause smoke
          if ($LASTEXITCODE -ne 0) { throw "Rauchtest fehlgeschlagen" }
          dist\pdf-ocr\pdf-ocr.exe --no-pause smoke   # 2. Lauf muss überspringen

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-OCR
          path: |
            dist/PDF-OCR-Setup-*.exe
            dist/pdf-ocr-portable.exe

      - name: Release (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PDF-OCR-Setup-*.exe
            dist/pdf-ocr-portable.exe
          generate_release_notes: true
